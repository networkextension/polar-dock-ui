name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # ci-mac @ .82 的 polar-cloud macOS VM（repo 级 self-hosted runner，
    # 与 polar-WindTunnel / polar-firewall 同机）。
    # 本仓是私有仓：跑 ubuntu-latest 会被账单拦下（4 秒零步骤，
    # "recent account payments have failed"），自建 runner 不计费。
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: node scripts/test-login-return.mjs

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist/
          retention-days: 14
