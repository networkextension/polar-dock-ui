<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开放 API Tokens — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">开放 API · 个人/团队访问令牌</span>
          <div class="lp-topbar-end" style="display:flex; gap:6px; align-items:center;">
            <span id="tokenCount" class="meta-subtitle"></span>
            <label class="meta-subtitle" style="display:flex; gap:4px; align-items:center; cursor:pointer;">
              <input id="showRevokedToggle" type="checkbox" /> 显示已撤销
            </label>
            <button id="newTokenBtn" class="btn-inline btn-primary" type="button">+ 新建 Token</button>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; overflow-y:auto;">
          <p class="meta-subtitle" style="margin: 0 0 12px 0;">
            为脚本、CI、第三方应用申请长期访问令牌，避免抓取 30 分钟会话 cookie。令牌以
            <code>Authorization: Bearer polar_…</code> 调用本站 <code>/api/*</code> 接口，
            权限等同于你本人在<strong>当前工作区</strong>内的访问权限。密钥仅在创建时显示一次，
            服务端只保存哈希，请妥善保存。
          </p>

          <div id="tokenError" class="status-text" style="color: var(--danger, #c00); margin-bottom: 8px;" hidden></div>

          <table id="tokenTable" class="lp-table" hidden>
            <thead>
              <tr>
                <th>名称</th>
                <th>前缀</th>
                <th>权限范围</th>
                <th>创建</th>
                <th>最近使用</th>
                <th>状态</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tokenTbody"></tbody>
          </table>
          <div id="tokenEmpty" class="meta-subtitle" hidden>还没有令牌。点击右上角「新建 Token」创建一个。</div>
          <div id="tokenLoading" class="meta-subtitle">加载中...</div>
        </div>
      </div>
    </div>

    <!-- Create modal: name only (P0). -->
    <div id="createModal" class="lp-modal" hidden>
      <div class="lp-modal-card" style="max-width: 480px;">
        <div class="lp-modal-head">
          <span class="lp-modal-title">新建 API Token</span>
          <button id="createCloseBtn" type="button" class="lp-modal-close">✕</button>
        </div>
        <div class="lp-modal-body">
          <label class="settings-section-title" for="createName" style="font-size:12px;">名称</label>
          <input id="createName" class="input" type="text" placeholder="e.g. ci-deploy / share.lzhu.cn" style="width:100%; margin-bottom:10px;" />

          <label class="settings-section-title" style="font-size:12px;">权限范围（不勾选 = 完全访问，兼容旧令牌）</label>
          <label style="display:flex; gap:6px; align-items:center; margin:4px 0 6px 0; cursor:pointer;">
            <input id="scopeWildcard" type="checkbox" /> <span>完全访问（不含管理员接口）</span>
          </label>
          <div id="scopeTree" style="max-height:240px; overflow-y:auto; border:1px solid var(--border,#e5e7eb); border-radius:6px; padding:6px 8px; margin-bottom:8px; font-size:13px;">
            <div class="meta-subtitle">加载权限列表…</div>
          </div>
          <div id="createError" class="status-text" style="color: var(--danger, #c00); min-height:16px;"></div>
        </div>
        <div class="lp-modal-foot">
          <button id="createCancelBtn" type="button" class="btn-inline btn-secondary">取消</button>
          <button id="createSubmitBtn" type="button" class="btn-inline btn-primary">创建 Token</button>
        </div>
      </div>
    </div>

    <!-- Show-once secret modal. -->
    <div id="plaintextModal" class="lp-modal" hidden>
      <div class="lp-modal-card" style="max-width: 560px;">
        <div class="lp-modal-head">
          <span class="lp-modal-title">令牌已创建</span>
        </div>
        <div class="lp-modal-body">
          <p class="status-text" style="color: var(--danger, #c00); margin: 0 0 8px 0;">
            ⚠️ 该密钥只显示这一次，关闭后无法再次查看。请立即复制保存。
          </p>
          <label class="settings-section-title" style="font-size:12px;">Secret</label>
          <div style="display:flex; gap:6px; margin-bottom:8px;">
            <input id="plaintextValue" class="input" type="text" readonly style="flex:1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;" />
            <button id="plaintextCopyBtn" type="button" class="btn-inline btn-secondary">📋 复制</button>
          </div>
          <label class="settings-section-title" style="font-size:12px;">用法示例</label>
          <pre style="background: var(--surface-2, #f3f4f6); padding:8px; border-radius:6px; overflow-x:auto; font-size:12px; margin:4px 0 0 0;"><code id="plaintextUsage"></code></pre>
        </div>
        <div class="lp-modal-foot">
          <button id="plaintextDoneBtn" type="button" class="btn-inline btn-primary">完成</button>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/api-tokens.js"></script>
  </body>
</html>
