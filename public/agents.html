<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">Agents · 逻辑实例视图</span>
          <div class="lp-topbar-end" style="display:flex; gap:6px; align-items:center;">
            <span id="agentsMeta" class="meta-subtitle"></span>
            <button id="refreshBtn" class="btn-inline btn-secondary" type="button" title="刷新">⟲</button>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; overflow-y:auto;">
          <p class="meta-subtitle" style="margin: 0 0 12px 0;">
            一台物理主机（host）可以运行多个 agent 进程，每个 agent 绑定到一个 bot 用户。
            本页列出当前 workspace 下所有 agent 实例；过滤参数 <code>?host_id=...</code> 用于只看某台主机上的 agent。
            参考 <code>doc/arch/agent-identity-v4.md</code>。
          </p>

          <div class="settings-section-card" style="margin: 0 0 12px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <label class="settings-section-title" for="filterHostID" style="font-size:11px;">Host ID</label>
              <input id="filterHostID" class="input" type="text" placeholder="(all)" style="min-width:280px; font-family:monospace; font-size:12px;" />
            </div>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <label class="settings-section-title" for="filterOS" style="font-size:11px;">OS</label>
              <select id="filterOS" class="input" style="min-width:120px;">
                <option value="">所有</option>
                <option value="darwin">darwin</option>
                <option value="linux">linux</option>
                <option value="freebsd">freebsd</option>
              </select>
            </div>
            <div style="display:flex; gap:6px;">
              <button id="filterApplyBtn" type="button" class="btn-inline btn-primary">应用</button>
              <button id="filterResetBtn" type="button" class="btn-inline btn-secondary">重置</button>
            </div>
          </div>

          <div id="agentsError" class="status-text" style="color: var(--danger, #c00); margin-bottom: 8px;" hidden></div>

          <table id="agentsTable" class="lp-table" hidden>
            <thead>
              <tr>
                <th>名称</th>
                <th>Agent ID</th>
                <th>主机</th>
                <th>IPv4</th>
                <th>Bot</th>
                <th>OS / Arch</th>
                <th>Token (last 8)</th>
                <th>最近 hello</th>
                <th>创建于</th>
              </tr>
            </thead>
            <tbody id="agentsTbody"></tbody>
          </table>
          <div id="agentsEmpty" class="meta-subtitle" hidden>暂无 agent 实例。在主机上运行 <code>polar-agent register</code> 即可注册。</div>
          <div id="agentsLoading" class="meta-subtitle">加载中…</div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/agents.js"></script>
  </body>
</html>
