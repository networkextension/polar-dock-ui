          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">主机 · 状态优先</span>
          <div class="lp-topbar-end" style="display:flex; gap:6px; align-items:center;">
            <span id="hostsMeta" class="meta-subtitle"></span>
            <span id="detailMeta" class="meta-subtitle"></span>
            <button id="refreshBtn" class="btn-inline btn-secondary" type="button" title="刷新">⟲</button>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; overflow-y:auto;">
          <!-- ── List view ─────────────────────────────────────────── -->
          <section id="listView" hidden>
            <div class="settings-section-card" style="margin: 0 0 12px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
              <div style="display:flex; flex-direction:column; gap:2px;">
                <label class="settings-section-title" for="filterOS" style="font-size:11px;">OS</label>
                <select id="filterOS" class="input" style="min-width:120px;">
                  <option value="">所有</option>
                  <option value="darwin">darwin</option>
                  <option value="linux">linux</option>
                  <option value="freebsd">freebsd</option>
                </select>
              </div>
              <div style="display:flex; flex-direction:column; gap:2px;">
                <label class="settings-section-title" for="filterVirt" style="font-size:11px;">虚拟化</label>
                <select id="filterVirt" class="input" style="min-width:140px;">
                  <option value="">所有</option>
                  <option value="none">none (bare-metal)</option>
                  <option value="vmware">vmware</option>
                  <option value="kvm">kvm</option>
                  <option value="hyperv">hyperv</option>
                  <option value="xen">xen</option>
                  <option value="virtualbox">virtualbox</option>
                  <option value="ec2-nitro">ec2-nitro</option>
                </select>
              </div>
              <div style="display:flex; flex-direction:column; gap:2px;">
                <label class="settings-section-title" for="filterMinMem" style="font-size:11px;">最小内存</label>
                <select id="filterMinMem" class="input" style="min-width:120px;">
                  <option value="0">所有</option>
                  <option value="8">&ge; 8 GB</option>
                  <option value="16">&ge; 16 GB</option>
                  <option value="32">&ge; 32 GB</option>
                  <option value="64">&ge; 64 GB</option>
                </select>
              </div>
            </div>

            <div id="hostsError" class="status-text" style="color: var(--danger, #c00); margin-bottom: 8px;" hidden></div>
            <div id="hostsContainer"></div>
          </section>

          <!-- ── Detail view ───────────────────────────────────────── -->
          <section id="detailView" hidden>
            <div style="margin-bottom: 8px;">
              <a id="detailBackBtn" href="/hosts.html" class="btn-inline btn-secondary" style="text-decoration:none;">← 返回主机列表</a>
            </div>

            <div id="detailError" class="status-text" style="color: var(--danger, #c00); margin-bottom: 8px;" hidden></div>

            <div id="detailHeader" class="settings-section-card" style="margin-bottom: 12px;"></div>
            <div id="detailBody"></div>

            <details id="editDetails" class="settings-section-card" style="margin-top: 12px;">
              <summary style="cursor:pointer; font-weight:600;">✎ 编辑主机</summary>
              <form id="editForm" style="margin-top: 8px; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; flex-direction:column; gap:2px;">
                  <label class="settings-section-title" for="editHostName" style="font-size:11px;">主机名</label>
                  <input id="editHostName" class="input" type="text" maxlength="120" style="max-width: 360px;" />
                </div>
                <div id="editStatus" class="meta-subtitle" hidden></div>
                <div style="display:flex; gap:6px;">
                  <button type="submit" class="btn-inline btn-primary">保存</button>
                  <button id="editCancelBtn" type="button" class="btn-inline btn-secondary">取消</button>
                </div>
                <div class="meta-subtitle" style="font-size:11px;">
                  注：后端 PATCH 接口未实现 — 此表单当前为 UI stub。
                </div>
              </form>
            </details>
          </section>
        </div>
