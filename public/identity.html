<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>声纹 / 人物 — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .id-tabs { display:flex; gap:6px; margin-bottom:14px; }
      .id-tab { border:1px solid var(--border,#ddd); background:transparent; color:var(--text-muted,#888);
        padding:6px 14px; border-radius:8px; cursor:pointer; }
      .id-tab.on { color:var(--accent,#3b82f6); border-color:var(--accent,#3b82f6); }
      .id-card { border:1px solid var(--border,#e5e5e5); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
      .id-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
      .id-meta { font-size:12px; color:var(--text-muted,#888); }
      .id-chip { display:inline-block; padding:1px 8px; border-radius:999px; border:1px solid var(--border,#ccc); font-size:12px; }
      .id-cands { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
      .id-cand { display:flex; gap:8px; align-items:center; font-size:13px; }
      .id-bar { height:6px; border-radius:3px; background:#3b82f6; }
      audio { height:34px; vertical-align:middle; }
      .id-assign { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; }
      .id-mono { font-family:ui-monospace,Menlo,monospace; font-size:11px; }
    </style>
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" /><span class="lp-brand-name" data-site-name>Polar-</span>
        </a>
        <nav class="lp-nav"><a class="lp-nav-item" href="/dashboard.html">
          <span class="lp-nav-icon" data-icon="layout-dashboard">⊞</span><span>Dashboard</span></a></nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info"><div class="lp-foot-name" id="lpFootName">—</div><div class="lp-foot-role" id="lpFootRole">—</div></div>
          <div class="lp-sidebar-foot-actions">
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>
      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">声纹 / 人物 · 生物特征归纳（仅管理员）</span>
          <div class="lp-topbar-end"><button id="refreshBtn" class="btn-inline btn-secondary" type="button" title="刷新">⟲</button></div>
        </div>
        <div class="lp-content" style="padding:12px; overflow-y:auto;">
          <div id="denied" class="meta-subtitle" hidden style="color:var(--danger,#c00);"></div>
          <div id="board" hidden>
            <div class="id-tabs">
              <button class="id-tab on" data-tab="pending" id="tabPending">🕓 待确认</button>
              <button class="id-tab" data-tab="people" id="tabPeople">👤 人物</button>
            </div>
            <p class="meta-subtitle" id="hint" style="margin:0 0 12px;">未归纳的声纹样本 —— 放原声对比,选/建人物后归纳。识别仅给候选,确认后才归到具体人。</p>
            <div id="view"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/scripts/identity.js"></script>
  </body>
</html>
