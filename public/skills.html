<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">Skills · 安装到 host</span>
          <div class="lp-topbar-end">
            <span id="skillsStatus" class="meta-subtitle"></span>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; display: flex; flex-direction: column; gap: 14px;">
          <section class="lp-preview-main">
            <div class="lp-preview-head">
              <span class="badge">Skill 市场</span>
              <label style="display: inline-flex; align-items: center; gap: 6px; margin-left: 12px;">
                <span class="meta-subtitle">目标 host：</span>
                <select id="skillsHostSelect" class="input" style="min-width: 280px;"></select>
              </label>
            </div>
            <div class="lp-preview-body">
              <p class="meta-subtitle" style="margin: 0 0 12px 0;">
                选目标 host → 装可用的 bundle。安装触发后 agent 异步下载并校验 SHA256，~30s-2min 内 advertise 回传安装态。
                目录里没有需要的 skill？管理员先 <code>POST /api/skill-catalog</code> 注册一条 catalog 行。
              </p>
              <table id="skillsTable" class="lp-table">
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>Publisher</th>
                    <th>版本</th>
                    <th>大小</th>
                    <th>范围</th>
                    <th>安装态</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="skillsTbody"></tbody>
              </table>
              <div id="skillsEmpty" class="meta-subtitle" hidden>
                目录暂无可装 skill。
                <a href="https://github.com/networkextension/polar-agent/blob/main/doc/bundle-format.md" target="_blank" rel="noopener">参考 bundle 格式</a>
                打包一个 .skill 后调
                <code>POST /api/skill-catalog</code> 注册。
              </div>
              <div id="skillsLoading" class="meta-subtitle">加载中…</div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/skills.js"></script>
  </body>
</html>
