<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邀请码 — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">邀请码</span>
        </div>

        <div class="lp-content" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 560px;">
          <section class="lp-preview-main" style="border-radius: 10px;">
            <div class="lp-preview-head" style="padding: 8px 12px;">
              <span class="badge">注册需要邀请码</span>
            </div>
            <div class="lp-preview-body" style="padding: 10px 12px;">
              <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <label class="switch-row" for="invitesRequiredToggle" style="margin: 0;">
                  <input id="invitesRequiredToggle" type="checkbox" />
                  <span>启用邀请码注册</span>
                </label>
                <button id="invitesSaveToggleBtn" class="btn-inline btn-secondary" type="button" style="padding: 6px 12px; font-size: 12px; margin-left: auto;">保存</button>
              </div>
              <div id="invitesToggleStatus" class="status-text" style="margin-top: 6px; font-size: 12px;"></div>
            </div>
          </section>

          <section class="lp-preview-main" style="border-radius: 10px;">
            <div class="lp-preview-head" style="padding: 8px 12px;">
              <span class="badge">生成一次性邀请码</span>
            </div>
            <div class="lp-preview-body" style="padding: 10px 12px;">
              <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <input id="invitesGenerateCount" class="input" type="number" min="1" max="50" value="5" style="max-width: 80px; padding: 6px 8px; font-size: 12px;" />
                <span style="font-size: 12px; color: var(--muted);">个</span>
                <button id="invitesGenerateBtn" class="btn-inline btn-secondary" type="button" style="padding: 6px 12px; font-size: 12px; margin-left: auto;">生成</button>
              </div>
              <div id="invitesGenerateStatus" class="status-text" style="margin-top: 6px; font-size: 12px;"></div>
              <ul id="invitesCodeList" class="tag-list" style="margin-top: 10px;"></ul>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/invites.js"></script>
  </body>
</html>
