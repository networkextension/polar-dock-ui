<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="markdowns.title">Public Markdowns</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>
        <nav class="lp-nav"></nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">U</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings" data-i18n-tooltip="nav.settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title" data-i18n="markdowns.title">Public Markdowns</span>
          <div class="lp-topbar-end">
            <span id="markdownsWelcome" class="lp-mode-badge" data-i18n="markdowns.browse">Browse all publicly published documents</span>
            <a class="lp-topbar-back" href="/dashboard.html" data-i18n="markdowns.backToDashboard">Dashboard</a>
          </div>
        </div>

        <div class="lp-content">
          <div class="lp-section">
            <div class="markdowns-scope-tabs" style="display:flex; gap:6px; margin-bottom:12px;">
              <button type="button" class="btn btn-ghost btn-sm is-active" data-scope="own">我的</button>
              <button type="button" class="btn btn-ghost btn-sm" data-scope="workspace">工作区</button>
              <button type="button" class="btn btn-ghost btn-sm" data-scope="public">公开</button>
            </div>
            <div id="markdownList" class="lp-feed"></div>
            <button id="markdownLoadMoreBtn" class="lp-manage-btn" type="button" style="margin-top:12px;" data-i18n="markdowns.loadMore">Load more</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/markdowns.js"></script>
  </body>
</html>
