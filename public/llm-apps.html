<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM 申请审核 — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">LLM 申请审核</span>
          <div class="lp-topbar-end">
            <span id="billingStatus" class="meta-subtitle"></span>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; display: flex; flex-direction: column; gap: 14px;">
          <section class="lp-preview-main" id="adminAppsSection">
            <div class="lp-preview-head">
              <span class="badge">管理员 · 申请记录</span>
              <span id="appsCount" class="lp-mode-badge">—</span>
            </div>
            <div class="lp-preview-body">
              <p class="meta-subtitle" style="margin: 0 0 10px 0;">
                所有工作区对共享 LLM 配置的申请历史。当前自动审批（默认月预算 $10），未来可改为人工审批工作流。
              </p>
              <table id="appsTable" class="lp-table" hidden>
                <thead>
                  <tr>
                    <th>时间</th><th>团队</th><th>申请人</th><th>LLM 配置</th><th>状态</th><th>授予预算</th><th>备注</th>
                  </tr>
                </thead>
                <tbody id="appsTbody"></tbody>
              </table>
              <div id="appsEmpty" class="meta-subtitle" hidden>暂无申请记录。</div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/llm-billing.js"></script>
  </body>
</html>
