<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-site-title>资产管理（管理员）</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand is-loading" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" hidden />
          <span class="lp-brand-name" data-site-name></span>
        </a>

        <nav class="lp-nav"></nav>

        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">资产管理 · 工作区配额 + Provider 注册</span>
          <div class="lp-topbar-end" style="display:flex; gap:6px; align-items:center;">
            <button id="addProviderOpenBtn" class="btn-inline btn-primary">+ 新增 Provider</button>
            <button id="refreshBtn" class="btn-inline btn-secondary">↻ 刷新</button>
          </div>
        </div>

        <div class="lp-content" style="padding:16px;">
          <!-- Root config -->
          <section style="margin-bottom:24px;">
            <h3 style="margin:0 0 8px 0; font-size:14px;">平台根配额</h3>
            <div id="rootConfig" style="padding:12px; background:var(--surface-2, #f3f4f6); border-radius:6px; font-size:13px; display:grid; gap:4px;">—</div>
          </section>

          <!-- Workspace quotas -->
          <section style="margin-bottom:24px;">
            <h3 style="margin:0 0 8px 0; font-size:14px;">工作区配额</h3>
            <div id="quotasEmpty" class="meta-subtitle" hidden style="padding:12px; text-align:center;">—</div>
            <table class="lp-table" style="width:100%;">
              <thead>
                <tr>
                  <th>workspace_id</th>
                  <th style="text-align:right;">配额</th>
                  <th style="text-align:right;">用量</th>
                  <th>用量比</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="quotasTbody"></tbody>
            </table>
          </section>

          <!-- Providers -->
          <section>
            <h3 style="margin:0 0 8px 0; font-size:14px;">边缘 Provider</h3>
            <div id="providersEmpty" class="meta-subtitle" hidden style="padding:12px; text-align:center;">—</div>
            <table class="lp-table" style="width:100%;">
              <thead>
                <tr>
                  <th>slug</th>
                  <th>base_url</th>
                  <th>region</th>
                  <th style="text-align:right;">容量</th>
                  <th>last_seen</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="providersTbody"></tbody>
            </table>
          </section>
        </div>
      </div>
    </div>

    <!-- Edit-quota modal -->
    <div id="editQuotaModal" hidden class="lp-modal">
      <div class="lp-modal-card" style="max-width:420px;">
        <h3 style="margin:0 0 4px;">编辑配额：<span id="editQuotaTitle"></span></h3>
        <div id="editQuotaCurrent" class="meta-subtitle" style="margin-bottom:12px;"></div>
        <label>新配额（GB）
          <input type="number" id="editQuotaInput" class="input" min="0" step="0.01" />
        </label>
        <div id="editQuotaError" style="margin-top:6px; font-size:13px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button id="editQuotaCancel" class="btn-inline btn-secondary">取消</button>
          <button id="editQuotaSubmit" class="btn-inline btn-primary">保存</button>
        </div>
      </div>
    </div>

    <!-- Add-provider modal -->
    <div id="addProviderModal" hidden class="lp-modal">
      <div class="lp-modal-card" style="max-width:480px;">
        <h3 style="margin:0 0 12px;">新增 Provider</h3>
        <div style="display:grid; gap:8px;">
          <label>slug（唯一标识）
            <input type="text" id="addProviderSlug" class="input" placeholder="zen-prov-1" />
          </label>
          <label>base_url
            <input type="text" id="addProviderBaseUrl" class="input" value="https://" placeholder="https://assets-zen.4950.store:2443" />
          </label>
          <label>region
            <input type="text" id="addProviderRegion" class="input" placeholder="zen" />
          </label>
          <label>capacity_gb（GB）
            <input type="number" id="addProviderCapacity" class="input" value="500" min="1" />
          </label>
          <div id="addProviderError" style="color:#dc2626; font-size:13px;"></div>
          <div id="addProviderResult"></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button id="addProviderCancel" class="btn-inline btn-secondary">关闭</button>
          <button id="addProviderSubmit" class="btn-inline btn-primary">创建</button>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/admin-assets.js"></script>
  </body>
</html>
