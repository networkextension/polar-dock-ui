<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-site-title>API 参考</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand is-loading" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" hidden />
          <span class="lp-brand-name" data-site-name></span>
        </a>
        <nav class="lp-nav"></nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings"><span data-icon="settings"></span></button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">API 参考 · 公共 /api 接口</span>
          <div class="lp-topbar-end" style="display:flex; gap:6px; align-items:center;">
            <input id="refFilter" class="input" type="search" placeholder="过滤 path / scope…" style="width:220px;"  aria-label="过滤 path / scope…"/>
            <span id="refMeta" class="meta-subtitle"></span>
            <button id="downloadSpecBtn" class="btn-inline btn-secondary" type="button">下载 OpenAPI</button>
          </div>
        </div>

        <div class="lp-content" style="padding: 12px; overflow-y:auto;">
          <p class="meta-subtitle" style="margin: 0 0 12px 0;">
            用 <code>Authorization: Bearer polar_…</code> 调用以下接口（在
            <a href="/api-tokens.html">开放 API</a> 申请令牌）。每个接口标注所需 scope；
            令牌只能调用其被授予 scope 的接口（空 scope = 完全访问）。machine-readable spec:
            <a href="/api/openapi.json" target="_blank">/api/openapi.json</a>。
          </p>
          <div id="refError" class="status-text" style="color: var(--danger, #c00); margin-bottom:8px;" hidden></div>
          <div id="refGroups"></div>
          <div id="refLoading" class="meta-subtitle">加载中...</div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/api-reference.js"></script>
  </body>
</html>
