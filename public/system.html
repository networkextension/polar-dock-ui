<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统信息 — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar lp-sidebar-wide">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>
        <nav class="lp-nav">
          <a class="lp-nav-item" href="/dashboard.html"><span class="lp-nav-icon" data-icon="layout-dashboard">⊞</span><span>Dashboard</span></a>
          <a class="lp-nav-item" href="/teams.html"><span class="lp-nav-icon" data-icon="users-round">⌂</span><span>工作区</span></a>
          <a class="lp-nav-item" href="/hosts.html" hidden data-site-admin-nav><span class="lp-nav-icon" data-icon="server">▣</span><span>主机</span></a>
          <a class="lp-nav-item active" href="/system.html"><span class="lp-nav-icon" data-icon="cpu">⚙</span><span>系统信息</span></a>
        </nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">A</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main">
        <div class="lp-topbar">
          <span class="lp-topbar-title">系统信息 · 本机</span>
          <div class="lp-topbar-end" style="gap: 8px; display:flex; align-items:center;">
            <span id="autoRefreshStatus" class="lp-mode-badge">—</span>
            <button id="refreshBtn" class="btn-inline btn-secondary" type="button">⟲ 刷新</button>
            <button id="copyJsonBtn" class="btn-inline btn-secondary" type="button">📋 复制 JSON</button>
            <a class="btn-inline btn-secondary" href="/api/system/info" target="_blank" rel="noopener">原始 JSON →</a>
          </div>
        </div>

        <div class="lp-content" style="padding: 14px; overflow-y:auto;">
          <div id="loadingState" class="meta-subtitle">加载中…</div>
          <div id="errorState" class="status-text" style="color: var(--danger,#c00);" hidden></div>

          <!-- Hero -->
          <section id="heroSection" class="lp-preview-main" style="margin-bottom: 12px;" hidden>
            <div class="lp-preview-body">
              <h2 id="heroHostname" style="margin:0; font-size:20px;">—</h2>
              <div id="heroUname" class="meta-subtitle" style="font-family: ui-monospace,Menlo,monospace; margin-top:4px; word-break:break-word;"></div>
              <div id="heroVersion" class="meta-subtitle" style="margin-top:6px;"></div>
            </div>
          </section>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;" id="mainGrid" hidden>
            <!-- Left: identity / cpu / memory / runtime -->
            <section class="lp-preview-main">
              <div class="lp-preview-head"><span class="badge">基础信息</span></div>
              <div class="lp-preview-body">
                <table class="sysinfo-table" id="basicTable"></table>
              </div>
            </section>

            <!-- Right: disks + IPs -->
            <section class="lp-preview-main">
              <div class="lp-preview-head"><span class="badge">磁盘</span><span id="diskSummary" class="lp-mode-badge"></span></div>
              <div class="lp-preview-body">
                <ul class="sysinfo-disks" id="disksList"></ul>
              </div>
            </section>

            <section class="lp-preview-main">
              <div class="lp-preview-head"><span class="badge">进程运行时</span><span id="runtimeSummary" class="lp-mode-badge"></span></div>
              <div class="lp-preview-body">
                <table class="sysinfo-table" id="runtimeTable"></table>
              </div>
            </section>

            <section class="lp-preview-main">
              <div class="lp-preview-head"><span class="badge">网络接口</span><span id="ipSummary" class="lp-mode-badge"></span></div>
              <div class="lp-preview-body">
                <table class="sysinfo-table" id="ipsTable"></table>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/system.js"></script>
  </body>
</html>
